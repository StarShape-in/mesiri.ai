# Keepalive pool: reuse up to 16 connections to uvicorn instead of opening a
# new TCP connection for every webhook request. Saves 5-50ms per message.
upstream mesiri_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name mesiri.mercon.tech;

    location ^~ /mesiriadmin {
        alias /var/www/mesiriadmin/;
        try_files $uri $uri/ /mesiriadmin/index.html;
    }

    location / {
        proxy_pass http://mesiri_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # required for keepalive upstream
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mesiri.mercon.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mesiri.mercon.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = mesiri.mercon.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name mesiri.mercon.tech;
    return 404; # managed by Certbot
}
