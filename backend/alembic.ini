# Alembic configuration for Mesiri infrastructure migrations (M1).
# The database URL is injected at runtime from Settings (see migrations/env.py);
# it is intentionally left blank here so no credentials live in the repo.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
