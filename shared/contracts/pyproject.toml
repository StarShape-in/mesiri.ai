[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mesiri-contracts"
version = "0.1.0"
description = "Shared Mesiri domain contracts"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
